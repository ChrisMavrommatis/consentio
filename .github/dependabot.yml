version: 2
updates:
  # Dev dependencies only - the shipped bundle has none.
  #
  # Minor and patch travel together; majors stay ungrouped, because a grouped major cannot
  # be taken apart.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The workflows pin every action by commit SHA. This keeps the SHA and the version
  # comment beside it moving together, and an action major can change the runner's Node
  # or the artifact format.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: bundler
    directory: /website
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      jekyll:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
