name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: typecheck, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The test harness resolves .ts through module.registerHooks and relies on Node's
      # built-in type stripping. package.json says >=24 and this follows it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build:js
      - run: npm test

      # Runs the cookie, saved-state and Google-signal tests with no browser at all, to
      # keep them from quietly acquiring one. They also run under `npm test` above.
      - run: npm run test:plain

  dist:
    name: only the release workflow wrote dist/
    runs-on: ubuntu-latest
    steps:
      # Full history: the guard below reads the commits the push actually carried.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # There was a second check here that rebuilt dist/ and diffed it. It demanded dist/
      # match HEAD, which the release process forbids between releases - a dependency bump
      # moves the bundle and only a release may write dist/. Dropped 7 Sep 2026.
      - name: only the release workflow writes dist/
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/dist-guard.sh
