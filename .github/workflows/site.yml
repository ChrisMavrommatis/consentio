name: Documentation site

# Pages has to be switched to the "GitHub Actions" source in the repository settings before
# the deploy step can work, whatever this file says.
#
# No push trigger on purpose: the site is the fixture the by-hand release checks run on, so
# it moves when someone decides it moves.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Deploy the built site to GitHub Pages. Off builds and uploads only.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version-file: website/.ruby-version
          bundler-cache: true
          working-directory: website

      - run: npm ci --ignore-scripts

      # GitHub Pages cannot build this itself - jekyll-tidy is not on its plugin allowlist -
      # so the site is built here and only the output is handed over.
      # publish:site builds website/js/ and website/data/i18n/ first: both are gitignored,
      # so a checkout has neither and Jekyll would build a site whose loader is a 404.
      - name: Build the site
        env:
          JEKYLL_ENV: production
        run: npm run publish:site

      - name: What it was built for
        run: |
          echo "from website/_config.prod.yml:"
          grep -E '^(url|gtm_container_id)|^  route' website/_config.prod.yml
          echo "baseurl, from website/_config.yml:"
          grep -E '^baseurl' website/_config.yml

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/_site

  # Everything above is reversible. This is not: it replaces what is on the live site.
  deploy:
    name: deploy
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  not-published:
    name: not published
    needs: build
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Built and uploaded. Nothing was deployed."
          echo "Dispatch again with publish on, once Pages is set to the GitHub Actions source."
