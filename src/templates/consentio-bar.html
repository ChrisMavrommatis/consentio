<consentio-bar role="region" aria-labelledby="consentio-bar-title">
	<div class="container">
		<main>
			<h2 id="consentio-bar-title">{{ barTitle }}</h2>
			<p>
				{{ barDescription }}
			</p>
			<p class="policy"></p>
		</main>
		<footer>
			<button class="button" data-role="settings">{{ buttonSettings }}</button>
			<button class="button" data-role="rejectAll">{{ buttonRejectAll }}</button>
			<button class="button" data-role="acceptAll">{{ buttonAcceptAll }}</button>
		</footer>
	</div>
</consentio-bar>
