# Greek.

locale: el
name: Ελληνικά

texts:
  barTitle: Πολιτική Cookies

  barDescription: >-
    Χρησιμοποιούμε cookies για να σας παρέχουμε την καλύτερη δυνατή εμπειρία
    στον ιστότοπο μας.

  buttonSettings: Ρυθμίσεις
  buttonSave: Αποθήκευση
  buttonCancel: Ακύρωση
  buttonAcceptAll: Αποδοχή όλων

  modalTitle: Ρυθμίσεις Cookies

  modalDescription: >-
    Τα cookies είναι μικρά αρχεία κειμένου τα οποία, μέσω του προγράμματος
    περιήγησης εγκαθίστανται στον υπολογιστή ή την ηλεκτρονική συσκευή σας,
    προσθέτοντας λειτουργικότητα στην ιστοσελίδα και βελτιώνοντας την εμπειρία
    περιήγησης ή, εφόσον το επιλέξετε, απομνημονεύοντας τις προτιμήσεις σας.

  alwaysOnLabel: Πάντα Ενεργό

  cookieTableHeaderName: Όνομα Cookie
  cookieTableHeaderPurpose: Σκοπός Cookie
  cookieTableHeaderProvenance: Προέλευση Cookie
  cookieTableHeaderDuration: Διάρκεια Cookie

consents:
  strictly_necessary:
    title: Απολύτως απαραίτητα cookies
    description: >-
      Αυτά τα cookies είναι απαραίτητα για την περιήγησή σας στον ιστότοπο και
      τη χρήση των δυνατοτήτων του, όπως η πρόσβαση σε ασφαλείς περιοχές του.
      Τα cookies που επιτρέπουν στα ηλεκτρονικά καταστήματα να κρατούν τα
      προϊόντα σας στο καλάθι σας είναι ένα παράδειγμα απολύτως απαραίτητων
      cookies.

  preferences_functionality:
    title: Cookies προτιμήσεων
    description: >-
      Γνωστά και ως "cookies λειτουργικότητας", αυτά τα cookies επιτρέπουν σε
      έναν ιστότοπο να θυμάται τις επιλογές που έχετε κάνει στο παρελθόν, όπως
      ποια γλώσσα προτιμάτε.

  statistics_performance:
    title: Cookies στατιστικών
    description: >-
      Γνωστά και ως "cookies απόδοσης", αυτά τα cookies συλλέγουν πληροφορίες
      σχετικά με τον τρόπο χρήσης ενός ιστότοπου, όπως ποιες σελίδες
      επισκεφτήκατε και σε ποιους συνδέσμους κάνατε κλικ.

  marketing_advertising:
    title: Cookies εμπορικής προώθησης
    description: >-
      Αυτά τα cookies παρακολουθούν τη δραστηριότητά σας στο διαδίκτυο για να
      βοηθήσουν τους διαφημιστές να παρέχουν πιο σχετικές διαφημίσεις ή να
      περιορίσουν τον αριθμό των φορών που βλέπετε μια διαφήμιση. Αυτά τα
      cookies μπορούν να μοιραστούν αυτές τις πληροφορίες με άλλους οργανισμούς
      ή διαφημιστές. Είναι μόνιμα και σχεδόν πάντα προέλευσης τρίτων.
