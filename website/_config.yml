############################################################
# Site settings
############################################################
title                   : "Consentio"
# The fallback for a page that sets no description. Under 155 characters, so a search
# result does not cut it.
description             : >-
  A cookie consent banner for static sites. A tag manager reads consent as it loads, so
  Consentio puts the answer on the page before it.

author:
  name                  : "Chris Mavrommatis"
  url                   : "https://github.com/ChrisMavrommatis"

# Localhost on purpose. The published address lives in _config.prod.yml, which only the publish
# build passes, so a local build never emits a canonical link pointing at the live site.
url                     : "http://localhost:4001"
repository_url          : "https://github.com/ChrisMavrommatis/consentio"

# The version this documentation describes is read from package.json at build time - shown in
# the header and in the release note. It is not set here.

# How this build loads Consentio, and how the banner behaves once it is loaded.
#
# route     "direct"      the blocking <script> in the page head - what this repo builds
#           "tag-manager" no script tag; the container's Consentio Tag loads the banner
#           A page overrides it with `loader: true` or `loader: false` in its front matter.
#
# language  a whole language pack: /data/i18n/el.json runs this site's banner in Greek.
#           Empty falls back to /data/consentio-language.json, this site's own.
#
# debug     the loader's console logging.
#
# sample_held_scripts
#           true injects three <script type="text/plain" data-consentio="..."> tags, one per
#           category the visitor can refuse, each printing one console line when it runs.
#           For checking that a held script runs on grant and not before. Off unless testing.
#
# settings  one flat mapping; the build routes each key to where it works. Write policyUrl
#           site-relative and the build puts baseurl in front of it. Changing version
#           discards every answer already stored. Leaving consents out gives the four
#           defaults one home, and it is the banner.
consentio:
  route                 : "direct"
  language              : "/data/i18n/en.json"
  debug                 : false
  sample_held_scripts   : false
  settings:
    cookieName          : "consentio"
    version             : 3
    consentRequired     : true
    policyUrl           : "/cookie/"
    cookieLifetime      : 90
    shareAcrossSubdomains : true
    hideFloatingButton  : false

# The Google Tag Manager container. Empty here, so a local build emits no snippet at all.
gtm_container_id        : ""

############################################################
# Where things are
############################################################
source              : ./
destination         : ./_site
plugins_dir         : _plugins       # takes an array of strings and loads plugins in that order
layouts_dir         : _layouts
includes_dir        : _includes
data_dir            : _data
sass:
  sass_dir          : _sass
  cache             : false
  # style             : compressed

############################################################
# Handling Reading
############################################################
safe                : false
include             :
  - ".htaccess"
exclude             :
  - "Gemfile"
  - "Gemfile.lock"
  - "node_modules"
  - "vendor/bundle/"
  - "vendor/cache/"
  - "vendor/gems/"
  - "vendor/ruby/"
  - "README.md"
keep_files          : [".git", ".svn"]
encoding            : "utf-8"
markdown_ext        : "markdown,mkdown,mkdn,mkd,md"
strict_front_matter : false
############################################################
# Filtering Content
############################################################
show_drafts         : false
limit_posts         : 0
future              : false
unpublished         : false

############################################################
# Serving
############################################################
detach              : false
port                : 4001
host                : 127.0.0.1
baseurl             : "/consentio"    # GitHub project pages serve from /<repo>. Does not include hostname
show_dir_listing    : false
disable_disk_cache  : true

############################################################
# Conversion
############################################################
markdown            : kramdown
highlighter         : rouge
lsi                 : false
excerpt_separator   : "\n\n"
incremental         : false

############################################################
# Outputting
############################################################
permalink           : date        #pretty
paginate_path       : /page:num
timezone            : "Europe/Athens"
quiet               : false
verbose             : false
liquid:
  error_mode        : warn
  strict_filters    : false
  strict_variables  : false

############################################################
# Markdown Processors
############################################################
kramdown:
  auto_ids          : true
  entity_output     : as_char
  toc_levels        : '1..6'
  smart_quotes      : lsquo,rsquo,ldquo,rdquo
  input             : GFM
  hard_wrap         : false
  footnote_nr       : 1
  show_warnings     : false
  parse_block_html  : true

############################################################
# Plugins
############################################################
whitelist           : []
plugins             :
  - jekyll-tidy

############################################################
# Front Matter Defaults
############################################################
defaults:
  -
    scope:
      path           : "pages/**"
      type           : "pages"
    values:
      layout         : "page"


############################################################
################### END OF BASE CONFIG #####################
############################################################


############################################################
# jekyll-tidy
############################################################
jekyll_tidy:
  exclude       :         # an array of files to exclude from tidying.
    - "pages/robots.txt"
  ignore_env    : null     # a JEKYLL_ENV string on which to skip tidying entirely.
  compress_html : false    # a flag for whether or not to compress the HTML output

