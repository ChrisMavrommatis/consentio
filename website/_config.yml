############################################################
# Site settings
############################################################
title                   : "Consentio"
description             : >-
  A small, frontend-only consent banner for static sites. Two install routes, one cookie,
  Google Consent Mode signals on the dataLayer.

author:
  name                  : "Chris Mavrommatis"
  url                   : "https://github.com/ChrisMavrommatis"

# Localhost on purpose. The published address lives in _config.prod.yml, which only the publish
# build passes, so a local build never emits a canonical link pointing at the live site.
url                     : "http://localhost:4001"
repository_url          : "https://github.com/ChrisMavrommatis/consentio"

# The version this documentation describes. Shown in the header and in the release note.
docs_version            : "0.1.0"

# How this build loads Consentio, and how the banner behaves once it is loaded.
#
# The route is "direct" here so a local build and a pull-request build load no Google
# Tag Manager at all and drive the banner from the bundle this repository just built.
# _config.prod.yml overlays the published route, and only the publish build passes it.
#
# route     "direct"      the blocking <script> in the page head - what this repo builds
#           "tag-manager" no script tag; the container's Consentio Tag loads the banner
#
#           A page forces the direct route on with `loader: true` in its front matter and
#           off with `loader: false`, whatever the route says. That is how one site shows
#           both.
#
# language  which language file the loader fetches. It is a whole language pack, so
#           pointing it at /data/i18n/el.json runs the site's banner in Greek - which is
#           how a published pack is checked without a container. Empty falls back to
#           /data/consentio-language.json, this site's own, which overrides one word.
#
# debug     the loader's console logging.
#
# settings  becomes /data/consentio-settings.json, the file the loader fetches - how the
#           banner behaves. Write policyUrl site-relative; the build puts baseurl in front
#           of it, and in front of every other address the page fetches.
consentio:
  route                 : "direct"
  language              : "/data/i18n/en.json"
  debug                 : false
  settings:
    consentRequired     : true
    policyUrl           : "/cookie/"
    cookieLifetime      : 90
    shareAcrossSubdomains : true

# The Google Tag Manager container. Empty here, so a local build emits no snippet at all.
gtm_container_id        : ""

############################################################
# Where things are
############################################################
source              : ./
destination         : ./_site
plugins_dir         : _plugins       # takes an array of strings and loads plugins in that order
layouts_dir         : _layouts
includes_dir        : _includes
data_dir            : _data
sass:
  sass_dir          : _sass
  cache             : false
  # style             : compressed

############################################################
# Handling Reading
############################################################
safe                : false
include             :
  - ".htaccess"
exclude             :
  - "Gemfile"
  - "Gemfile.lock"
  - "node_modules"
  - "vendor/bundle/"
  - "vendor/cache/"
  - "vendor/gems/"
  - "vendor/ruby/"
  - "README.md"
keep_files          : [".git", ".svn"]
encoding            : "utf-8"
markdown_ext        : "markdown,mkdown,mkdn,mkd,md"
strict_front_matter : false
############################################################
# Filtering Content
############################################################
show_drafts         : false
limit_posts         : 0
future              : false
unpublished         : false

############################################################
# Serving
############################################################
detach              : false
port                : 4001
host                : 127.0.0.1
baseurl             : "/consentio"    # GitHub project pages serve from /<repo>. Does not include hostname
show_dir_listing    : false
disable_disk_cache  : true

############################################################
# Conversion
############################################################
markdown            : kramdown
highlighter         : rouge
lsi                 : false
excerpt_separator   : "\n\n"
incremental         : false

############################################################
# Outputting
############################################################
permalink           : date        #pretty
paginate_path       : /page:num
timezone            : "Europe/Athens"
quiet               : false
verbose             : false
liquid:
  error_mode        : warn
  strict_filters    : false
  strict_variables  : false

############################################################
# Markdown Processors
############################################################
kramdown:
  auto_ids          : true
  entity_output     : as_char
  toc_levels        : '1..6'
  smart_quotes      : lsquo,rsquo,ldquo,rdquo
  input             : GFM
  hard_wrap         : false
  footnote_nr       : 1
  show_warnings     : false
  parse_block_html  : true

############################################################
# Plugins
############################################################
whitelist           : []
plugins             :
  - jekyll-tidy

############################################################
# Front Matter Defaults
############################################################
defaults:
  -
    scope:
      path           : "pages/**"
      type           : "pages"
    values:
      layout         : "page"


############################################################
################### END OF BASE CONFIG #####################
############################################################


############################################################
# jekyll-tidy
############################################################
jekyll_tidy:
  exclude       :         # an array of files to exclude from tidying.
    - "pages/robots.txt"
  ignore_env    : null     # a JEKYLL_ENV string on which to skip tidying entirely.
  compress_html : false    # a flag for whether or not to compress the HTML output

