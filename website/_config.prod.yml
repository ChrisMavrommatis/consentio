# Production overlay. Passed alongside _config.yml only by the publish build:
#
#   bundle exec jekyll build --config _config.yml,_config.prod.yml
#
# npm run publish:site does that, and .github/workflows/site.yml runs it. Nothing else does.

# The published address, and the only place it is written down for the site. baseurl stays
# in _config.yml so a local build exercises the same /consentio prefix the live site has.
url                     : "https://chrismavrommatis.github.io"

# The container. Filling this in emits Google's snippet on every page.
gtm_container_id        : "GTM-K6V53LMT"

# Nothing checks this, and it must be true before a deploy: the Consentio Tag template is
# imported into the container above, on Consent Initialization - All Pages. Until it is, a
# publish with this set leaves the live site with no banner.
#
# /try-it/ carries `loader: true` so one page keeps the direct route whatever this says.
#
# Only the route moves. Jekyll deep-merges these files, so the language, the debug flag
# and the whole settings block come from _config.yml unchanged.
consentio:
  route                 : "tag-manager"
