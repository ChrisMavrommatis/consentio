# The cookie catalogue: rows a site owner copies into their own cookie table,
# one block per tool, each row already in Consentio's five-field shape.
#
# Every purpose and duration is what the vendor's own page said on the
# `checked` date; nothing here was written from memory, and a cookie the
# vendor does not document with a lifetime is left out. Durations drift, so
# verify against `documentation` before shipping.
#
# `category` is Consentio's opinion, not the vendor's. It is one of the four
# fixed keys: strictly_necessary, preferences_functionality,
# statistics_performance, marketing_advertising. Change it if you disagree.
#
# The first block is the one cookie Consentio itself sets; its duration
# follows the cookieLifetime setting.

- vendor: Consentio
  documentation: https://chrismavrommatis.github.io/consentio/cookie/
  checked: "2026-09-11"
  rows:
    - name: consentio
      purpose: Stores your answer to this cookie banner and the date you gave it.
      provenance: Consentio
      duration: 90 days by default; the cookieLifetime setting changes it
      category: strictly_necessary
    - name: consentio_probe
      purpose: Written and deleted in the same moment to find which domain the browser accepts, only when the answer is shared across subdomains.
      provenance: Consentio
      duration: none; it is removed as soon as it is read, and has no expiry so it dies with the tab
      category: strictly_necessary

